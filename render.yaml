services:
  - type: web
    name: namma-kadai-api
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/state
    disk:
      name: namma-kadai-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_FILE
        value: /var/data/data.json
      - key: SEED_DEMO
        value: "false"
      - key: ADMIN_PASSWORD
        sync: false
